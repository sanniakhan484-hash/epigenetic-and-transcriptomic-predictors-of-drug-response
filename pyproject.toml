[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drugresponse"
version = "0.1.0"
description = "Epigenetic and transcriptomic predictors of drug response in cancer cell lines"
requires-python = ">=3.10"
authors = [{ name = "Saniya Khan" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
